name: CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build-test:
    name: build + test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ttr.sln

      - name: Build
        run: dotnet build ttr.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ttr.sln --configuration Release --no-build --verbosity normal
